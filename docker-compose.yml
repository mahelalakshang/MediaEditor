services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker cluster: the internal __consumer_offsets topic
      # (which backs ALL consumer-group coordination) defaults to
      # replication factor 3 and can never be created with only one
      # broker — every consumer subscribe silently never gets a
      # partition assignment. This is the single most common single-node
      # Kafka gotcha; without it nothing that uses a consumer group works.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    # Ephemeral on purpose — no volume. State of record lives in SQLite
    # and the media/ directory, not Kafka retention, so a fresh KRaft
    # cluster id on every `docker-compose up` is simpler than persisting
    # broker storage and risking a stale-cluster-id restart failure.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    environment:
      DATA_DIR: /data
      KAFKA_BROKERS: kafka:9092
      PORT: "8080"
      GRPC_PORT: "50051"
      RUST_LOG: info
    volumes:
      # Named volume for the DB specifically — SQLite's WAL mode over a
      # Windows bind mount is a known source of "database is locked"
      # flakiness on Docker Desktop.
      - db-data:/data/db
      # Bind mount for media files only — browsable from the host for
      # demo purposes, and doesn't need byte-range locking semantics.
      - ./data/media:/data/media
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  media-worker:
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    environment:
      DATA_DIR: /data
      KAFKA_BROKERS: kafka:9092
      RUST_LOG: info
    volumes:
      - db-data:/data/db
      - ./data/media:/data/media
    depends_on:
      kafka:
        condition: service_healthy
      # Waits on core-service specifically because core-service owns the
      # SQLite migrations — media-worker never runs them itself.
      core-service:
        condition: service_healthy

  bff:
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    environment:
      PORT: "3000"
      CORE_GRPC_URL: core-service:50051
      CORE_REST_URL: http://core-service:8080
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    ports:
      # Only port published to the host — single browser-facing origin.
      - "8081:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  db-data:
