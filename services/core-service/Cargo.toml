[package]
name = "core-service"
version = "0.1.0"
edition.workspace = true

[dependencies]
common = { path = "../../crates/common" }

axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
futures-util = "0.3"

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
tonic = "0.12"
prost = "0.13"
async-stream = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"
