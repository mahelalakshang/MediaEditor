# Single browser-facing origin: nginx fronts everything so the browser
# never needs CORS config or to know about the BFF/core-service split.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches core-service's own DefaultBodyLimit::max(50MB) — nginx's
    # 1MB default would otherwise reject real photos/videos before the
    # request even reaches the BFF.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE: disable buffering so status updates reach the browser as soon
    # as the BFF writes them, not once nginx's buffer fills up.
    location /events/ {
        proxy_pass http://bff:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Rendition images/video served directly from core-service's static
    # file route — bypasses the BFF entirely so media bytes don't get
    # routed through Node for no reason.
    location /media/ {
        proxy_pass http://core-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
